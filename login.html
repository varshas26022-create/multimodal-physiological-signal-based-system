<!DOCTYPE html>
<html>
<head>
    <title>Login - Cramp Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Arial, sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            width: 300px;
            text-align: center;
            color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            animation: fadeIn 1s ease-in-out;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            border: none;
            outline: none;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            background: #00c6ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <form method="POST" class="glass">
        <h2>Muscle Cramp Detection</h2>
        <input type="text" name="username" required>
<input type="password" name="password" required>
        <button type="submit">Login</button>
    </form>

</body>
</html>
